name: petropoints-dev

# Local development stack. Never use these credentials outside your machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petropoints
      POSTGRES_PASSWORD: petropoints_dev
      POSTGRES_DB: petropoints
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petropoints']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports: ['9092:9092', '9644:9644']
    volumes: [redpanda:/var/lib/redpanda/data]

  redpanda-console:
    image: redpandadata/console:v2.8.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ['8080:8080']
    depends_on: [redpanda]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: petropoints
      CLICKHOUSE_PASSWORD: petropoints_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['8123:8123', '9000:9000']
    volumes: [chdata:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: petropoints
      MINIO_ROOT_PASSWORD: petropoints_dev
    ports: ['9100:9000', '9001:9001']
    volumes: [miniodata:/data]

  # Fake email: every message the API sends lands here, nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['1025:1025', '8025:8025']
    environment:
      MP_MAX_MESSAGES: 5000

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otel/config.yaml']
    volumes: ['./otel/collector.yaml:/etc/otel/config.yaml:ro']
    ports: ['4317:4317', '4318:4318', '8889:8889']
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['16686:16686']

  prometheus:
    image: prom/prometheus:v3.3.0
    volumes: ['./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: petropoints_dev
    ports: ['3001:3000']
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  redpanda:
  chdata:
  miniodata:
